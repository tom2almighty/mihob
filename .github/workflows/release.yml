name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies & build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -v ./...

      - name: Cross-compile release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TARGETS=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for item in "${TARGETS[@]}"; do
            read -r GOOS GOARCH <<< "${item}"
            EXT=""
            if [ "${GOOS}" = "windows" ]; then
              EXT=".exe"
            fi

            STAGE_DIR="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "${STAGE_DIR}"

            echo "Building mihob ${VERSION} for ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "${STAGE_DIR}/mihob${EXT}" ./cmd/mihob

            cp README.md "${STAGE_DIR}/"

            ARCHIVE_BASE="mihob_${VERSION}_${GOOS}_${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              (cd "${STAGE_DIR}" && zip -q -r "../${ARCHIVE_BASE}.zip" .)
            else
              tar -C "${STAGE_DIR}" -czf "dist/${ARCHIVE_BASE}.tar.gz" .
            fi
            rm -rf "${STAGE_DIR}"
          done

          (cd dist && sha256sum mihob_* > checksums.txt)
          cat dist/checksums.txt

      - name: Determine prerelease flag
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            dist/mihob_*.tar.gz
            dist/mihob_*.zip
            dist/checksums.txt

  release-docker:
    name: Build & Push Docker Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: release-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hub
            dockerfile: deploy/Dockerfile.hub
            image: mihob-hub
          - target: agent
            dockerfile: deploy/Dockerfile.agent
            image: mihob-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
