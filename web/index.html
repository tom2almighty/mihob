<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mihob</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("mihob_theme") || "system"
          const isDark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(isDark ? "dark" : "light")

          const css = localStorage.getItem("mihob_theme_css_cache_v3")
          if (css) {
            const style = document.createElement("style")
            style.id = "mihob-custom-theme"
            style.textContent = css
            document.head.appendChild(style)
          }

          const fontUrl = localStorage.getItem("mihob_theme_font_url_cache")
          if (fontUrl && fontUrl.indexOf("https://fonts.googleapis.com/") === 0) {
            const link = document.createElement("link")
            link.id = "mihob-theme-fonts"
            link.rel = "stylesheet"
            link.href = fontUrl
            document.head.appendChild(link)
          }
        } catch {}
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
